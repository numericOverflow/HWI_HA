name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install ruff mypy pytest

      - name: Run ruff check
        run: ruff check custom_components/ tests/

      - name: Run ruff format check
        run: ruff format --check custom_components/ tests/

  test-protocol:
    name: Protocol Tests (no HA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio

      - name: Run protocol-layer tests
        run: |
          cd ${{ github.workspace }}
          python -m pytest tests/ -m "not requires_ha" -v --tb=short

  test-integration:
    name: Integration Tests (with HA)
    runs-on: ubuntu-latest
    needs: [lint, test-protocol]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Home Assistant and test dependencies
        run: |
          pip install homeassistant pytest pytest-asyncio pytest-homeassistant-custom-component

      - name: Run all tests
        run: |
          python -m pytest tests/ -v --tb=short

  hacs-validation:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: hassfest validation
        uses: home-assistant/actions/hassfest@master
