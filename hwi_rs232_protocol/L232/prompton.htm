<table border="0" width="100%">
    <tr>
        <td width="50%"><font size="6" face="Arial">PROMPTON</font></td>
        <td align="right" width="50%"><font size="5" face="Arial">Turn
        on the L232&gt; Prompt</font></td>
    </tr>
</table>

<p><font size="3" face="Arial"><strong>Syntax</strong></font><font
size="2" face="Arial"><br>
</font><font size="3" face="Arial">PROMPTON</font></p>

<p><font face="Arial"><strong>Description</strong></font><font
size="2" face="Arial"><br>
</font><font face="Arial">Re-enables the L232&gt; prompt. After
every command execution, a new L232&gt; prompt will be issued.</font></p>

<p><font face="Arial"><strong>Example</strong></font><font
size="2" face="Arial"><br>
</font><font face="Arial">Turn the L232&gt; prompt on.</font></p>

<p><font face="Courier">PROMPTON</font><font size="2"
face="Arial"><br>
</font><font face="Courier">L232&gt;</font></p>

<p><font face="Arial"><strong>See Also</strong></font><font
size="2" face="Arial"><br>
</font><a href="promptoff.htm"><font face="Arial">PROMPTOFF -
Turn the L232&gt; prompt off</font></a></p>
